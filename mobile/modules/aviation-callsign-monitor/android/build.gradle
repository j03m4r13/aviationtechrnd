plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aviationcallsign'
version = '0.1.0'

android {
  namespace 'expo.modules.aviationcallsign'

  defaultConfig {
    // Match the Expo application's Android minimum. The native monitor uses
    // AudioRecord.Builder (API 23) and does not require API 26-only features.
    minSdk 24
    versionCode 1
    versionName '0.1.0'

    ndk {
      // Initial high-performance path: ASUS ROG Phone 7 and modern Android devices.
      abiFilters 'arm64-v8a'
    }

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -O3'
        arguments '-DANDROID_STL=c++_shared', '-DGGML_NATIVE=OFF'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
      version '3.22.1'
    }
  }

  packaging {
    resources {
      excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
    }
  }
}

dependencies {
  implementation 'androidx.core:core:1.13.1'
  implementation 'com.alphacephei:vosk-android:0.3.75'
  testImplementation 'junit:junit:4.13.2'
}
